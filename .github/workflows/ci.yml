name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format --check)
        run: ruff format --check .

      - name: Byte-compile sources
        run: python -m compileall -q src scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell syntax
        run: bash -n scripts/build_and_push.sh

      - name: Validate example JSON
        run: |
          python - <<'EOF'
          import json, glob
          files = glob.glob("runpod/*.example") + ["test_input.json.example"]
          for f in files:
              json.load(open(f))
          print(f"validated {len(files)} JSON examples")
          EOF
